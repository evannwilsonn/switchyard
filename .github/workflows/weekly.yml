# Weekly scheduled run. Uses Snowflake when these repository secrets are set:
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PRIVATE_KEY (contents of rsa_key.p8)
# Without them it runs every product on DuckDB on the runner, so the job never fails just for missing secrets.
name: weekly-run
on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 07:17 New York (EDT)
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: SYSADMIN
    steps:
      - name: Choose the warehouse (Snowflake when its secrets exist, otherwise DuckDB)
        id: ready
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ] || [ -z "$SNOWFLAKE_USER" ]; then
            echo "::notice::Snowflake secrets not set; running on DuckDB."
            echo "target=duckdb" >> "$GITHUB_OUTPUT"
          else
            echo "target=snowflake" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Write the Snowflake key
        if: steps.ready.outputs.target == 'snowflake'
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.snowflake/rsa_key.p8" >> "$GITHUB_ENV"
      - name: Run every product
        run: python -m switchyard.run --target ${{ steps.ready.outputs.target }} --trigger schedule
      - name: Build the platform view
        if: always()
        run: python -m app.build_app --target ${{ steps.ready.outputs.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: switchyard-app, path: app/build, if-no-files-found: warn}
